name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: t2r
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d t2r"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/t2r
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/t2r
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy t2r
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
