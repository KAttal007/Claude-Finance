# Runs before code leaves a developer's machine (design doc 22.6, 23): lint, format and secret
# scanning. Install once with `uv run pre-commit install`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-exchange-files
        name: no raw exchange files or user models
        entry: Raw XBRL, filings and workbooks must not be committed (design doc 23)
        language: fail
        files: \.(xbrl|xlsm)$|^(data|import|out)/
