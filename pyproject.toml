[project]
name = "ticker-to-report"
version = "0.1.0"
description = "Enter an NSE ticker; get validated numbers, an approved model update and draft research outputs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "minio>=7.2",
    "httpx>=0.27",
    "lxml>=5.3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "anthropic>=0.69",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "xlsxwriter>=3.2",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# Full XBRL taxonomy validation (heavy; the lxml fast path covers plain instances).
xbrl = ["arelle-release>=2.30"]
# Extra PDF table tooling and OCR fallback.
pdf = ["pdfplumber>=0.11", "camelot-py>=0.11", "pytesseract>=0.3"]
# Local embeddings instead of a hosted API.
embeddings = ["sentence-transformers>=3.0"]
# Market data.
kite = ["kiteconnect>=5.0"]
# Excel bridge: runs on the analyst's machine next to desktop Excel (Windows/macOS).
excel = ["xlwings>=0.32"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["t2r"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs network access to NSE or external APIs (skipped by default)",
    "golden: golden-set accuracy tests (need hand-checked fixtures)",
]
addopts = "-m 'not live'"
