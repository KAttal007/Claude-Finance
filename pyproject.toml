[project]
name = "analekh"
version = "0.1.0"
description = "Analekh: the analyst's record, kept for you. NSE filings to validated numbers, approved model updates and grounded drafts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
# Appendix G.1 (requirements.txt): API, Celery workers and scheduler.
dependencies = [
    # Web API
    "fastapi>=0.143,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "python-multipart>=0.0.32",
    # Database
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pgvector>=0.5,<1.0",
    # Jobs and scheduling
    "celery[redis]>=5.6,<6",
    # Object storage, HTTP and feeds
    "boto3>=1.43,<2",
    "httpx>=0.28,<1.0",
    "feedparser>=6.0,<7",
    "tenacity>=9.2,<10",
    # XBRL
    "arelle-release>=2.46,<3",
    "lxml>=6.1,<7",
    # PDF and OCR
    "pymupdf>=1.28,<2",
    "pdfplumber>=0.11,<1.0",
    "camelot-py>=2.0,<3",
    "pytesseract>=0.3.13,<1.0",
    # AI
    "anthropic>=1.13,<2",
    # Excel and documents
    "openpyxl>=3.1.5,<4",
    "formulas>=1.3,<2",
    "xlsxwriter>=3.2,<4",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0.2,<2",
    "matplotlib>=3.11,<4",
    # Data handling and matching
    "pandas>=3.0,<4",
    "numpy>=2.5,<3",
    "rapidfuzz>=3.14,<4",
    "python-dateutil>=2.9,<3",
    "pyyaml>=6.0",
    # Market data
    "kiteconnect>=5.2,<6",
    # CLI and logging
    "typer>=0.27,<1.0",
    "structlog>=26.1",
]

[project.scripts]
analekh = "analekh.cli:app"

[dependency-groups]
# Appendix G.4 (requirements-dev.txt)
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "time-machine>=3.5",
    "ruff>=0.17",
    "mypy>=2.4",
    "pre-commit>=4.6",
    "types-python-dateutil",
    "pandas-stubs",
    "boto3-stubs[s3]",
    "types-PyYAML",
]
# Appendix G.2 (requirements-bridge.txt): Excel bridge on the analyst's machine.
bridge = [
    "xlwings>=0.37,<1.0",
    "openpyxl>=3.1.5,<4",
    "watchdog>=6.0,<7",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.15,<3",
    "typer>=0.27,<1.0",
    "structlog>=26.1",
]
# Appendix G.3 (requirements-optional.txt): install only when used.
optional = [
    "sentence-transformers>=6.1,<7",
    "streamlit>=1.65,<2",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analekh"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "office-addin"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs network access to NSE or external APIs (skipped by default)",
    "golden: golden-set accuracy tests (need hand-checked fixtures)",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["analekh"]
